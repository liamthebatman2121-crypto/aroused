<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aroused · Admin</title>
<style>
:root{color-scheme:dark;--bg:#111113;--panel:#19191c;--line:#303036;--muted:#aaa7b0;--red:#f04452;--green:#70d6a0}*{box-sizing:border-box}body{margin:0;background:#101012;color:#f5f2f4;font:14px/1.5 system-ui,Segoe UI,sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1440px;margin:auto;padding:28px}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:18px}.brand{font-weight:800;font-size:22px}.brand b{color:var(--red)}.muted,small{color:var(--muted)}.login{max-width:440px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px}.login h1{margin:0 0 8px}.field{display:grid;gap:7px;margin:17px 0}.field input{background:#101012;color:white;border:1px solid var(--line);border-radius:9px;padding:12px}.btn{border:1px solid var(--line);border-radius:9px;padding:9px 13px;background:#242428;color:white}.btn:hover{border-color:#6d454b}.primary{background:var(--red);border-color:var(--red);font-weight:700}.danger{color:#ff9299}.global-search{flex:1;max-width:470px;margin:0 30px}.global-search input{width:100%;background:#101012;color:white;border:1px solid var(--line);border-radius:9px;padding:10px 12px}.global-search small{display:block;min-height:16px;margin:3px 5px 0}.wrap{display:grid;grid-template-columns:210px 1fr;gap:24px;margin-top:24px}.nav{display:grid;align-content:start;gap:7px}.nav button{text-align:left;background:transparent;border:1px solid transparent;border-radius:9px;color:#c6c2cb;padding:12px}.nav button.active,.nav button:hover{background:var(--panel);border-color:var(--line);color:white}.content{min-width:0}.content h1{margin:0 0 4px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat,.box{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:17px}.stat strong{display:block;font-size:26px;margin-top:6px}.box{margin-top:16px;overflow:auto}.box h2{margin:0 0 12px;font-size:17px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;vertical-align:middle;padding:11px 10px;border-bottom:1px solid #2c2c31}th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}td small{display:block}td .btn{padding:6px 9px;font-size:12px;margin:2px}.pill{display:inline-block;padding:3px 8px;border-radius:99px;background:#29292e;color:#d6d1dc;font-size:11px}.pill.green{color:var(--green)}.pill.red{color:#ff9097}.settings{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}.feedback{min-height:24px;color:var(--green);margin:12px 0}.error{color:#ff9299}.hidden{display:none!important}@media(max-width:850px){.shell{padding:18px}.top{flex-wrap:wrap}.global-search{order:3;flex-basis:100%;max-width:none;margin:12px 0 0}.wrap{grid-template-columns:1fr}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.stat{padding:12px}.stat strong{font-size:22px}}
</style></head><body><div class="shell"><header class="top"><div class="brand"><b>AROUSED</b> · Admin</div><div class="global-search hidden" id="searchWrap"><input id="adminSearch" type="search" placeholder="Search accounts, posts, comments, reports…" aria-label="Search this admin section"><small id="searchHint"></small></div><div><span id="who" class="muted"></span> <button class="btn hidden" id="logout">Log out</button></div></header>
<section class="login" id="loginBox"><h1>Admin sign in</h1><p class="muted">Use the administrator account configured for this server.</p><form id="loginForm"><label class="field">Email<input type="email" name="email" autocomplete="username" required></label><label class="field">Password<input type="password" name="password" autocomplete="current-password" required></label><button class="btn primary" type="submit">Sign in</button><div class="feedback" id="loginFeedback" role="status"></div></form></section>
<div class="wrap hidden" id="adminApp"><nav class="nav" aria-label="Admin sections"><button class="active" data-view="overview">Overview</button><button data-view="health">System health</button><button data-view="users">Accounts</button><button data-view="posts">Posts and albums</button><button data-view="reports">Reports</button><button data-view="cases">Safety cases</button><button data-view="appeals">Appeals</button><button data-view="settings">Site controls</button><button data-view="audit">Audit log</button></nav><main class="content"><div id="view"></div><div class="feedback" id="feedback" role="status"></div></main></div></div>
<script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let section='overview';
async function api(path,opts={}){const r=await fetch('/api'+path,{credentials:'same-origin',...opts,headers:{...(opts.body?{'Content-Type':'application/json'}:{}),...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`Request failed (${r.status})`);return d}
function msg(text,error=false){$('#feedback').textContent=text;$('#feedback').className='feedback'+(error?' error':'')}
async function start(){try{const d=await api('/admin/overview');$('#loginBox').classList.add('hidden');$('#adminApp').classList.remove('hidden');$('#searchWrap').classList.remove('hidden');$('#logout').classList.remove('hidden');$('#who').textContent=`${d.admin.name} · administrator`;await show('overview')}catch(e){if(e.message.includes('Administrator access')){loginVisible('This account is not an administrator.')}else loginVisible('')}}
function applySearch(){const q=$('#adminSearch').value.trim().toLowerCase(),rows=[...$('#view').querySelectorAll('tbody tr')];let shown=0;for(const row of rows){row.hidden=!!q&&!row.textContent.toLowerCase().includes(q);if(!row.hidden)shown++}$('#searchHint').textContent=q?`${shown} matching row${shown===1?'':'s'}`:''}
function loginVisible(text){$('#loginBox').classList.remove('hidden');$('#adminApp').classList.add('hidden');if(text)$('#loginFeedback').textContent=text}
async function show(view){section=view;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===(view.startsWith('post-comments:')?'posts':view)));const root=$('#view');msg('Loading…');try{
if(view==='overview'){const d=await api('/admin/overview'),s=d.stats;root.innerHTML=`<h1>Website overview</h1><p class="muted">Live counts from the local SQLite database.</p><div class="grid">${[['Accounts',s.users],['Active accounts',s.activeUsers],['Posts and albums',s.posts],['Published albums',s.uploads],['Open reports',s.pendingReports]].map(([a,b])=>`<div class="stat"><span class="muted">${a}</span><strong>${b}</strong></div>`).join('')}</div><div class="box"><h2>Site controls</h2><div class="settings"><span>New account registrations</span><span class="pill ${d.settings.signupsEnabled?'green':'red'}">${d.settings.signupsEnabled?'Enabled':'Paused'}</span></div><div class="settings"><span>Uploads</span><span class="pill ${d.settings.uploadsEnabled?'green':'red'}">${d.settings.uploadsEnabled?'Enabled':'Paused'}</span></div></div>`}
if(view==='health'){const {readiness:r,queues:q,security:s}=await api('/admin/health');const label=x=>x.status==='HEALTHY'||x.status==='CONFIGURED'?'green':'red';root.innerHTML=`<h1>System health</h1><p class="muted">Provider readiness reflects configuration and implemented adapters. It does not represent a successful media scan or age check.</p><div class="box"><h2>Production readiness: <span class="pill ${r.readyForProduction?'green':'red'}">${esc(r.status)}</span></h2><div class="grid">${Object.entries(r.providers).map(([name,p])=>`<div class="stat"><span class="muted">${esc(name)}</span><strong class="pill ${label(p)}">${esc(p.status)}</strong><small>${esc(p.implemented?'Adapter implemented':'Adapter unavailable')}${p.driver?' · '+esc(p.driver):''}</small>${p.missing?.length?`<small>Missing: ${esc(p.missing.join(', '))}</small>`:''}</div>`).join('')}</div></div><div class="box"><h2>Queues and security</h2><div class="grid">${[['Media awaiting checks',q.mediaPending],['Processing failures',q.processingFailed],['Open moderation cases',q.moderationOpen],['Restricted priority cases',q.restrictedPriority],['Security events (24h)',s.events24h]].map(([a,b])=>`<div class="stat"><span class="muted">${a}</span><strong>${b}</strong></div>`).join('')}</div></div>`}
if(view==='users'){const {items}=await api('/admin/users');root.innerHTML=`<h1>Accounts</h1><p class="muted">Manage staff roles, account access, and upload restrictions. Suspended members can still sign in to read notices and submit appeals.</p><div class="box"><table><thead><tr><th>Account</th><th>Email</th><th>Role</th><th>Posts</th><th>Status</th><th>Actions</th></tr></thead><tbody>${items.map(u=>`<tr><td>${esc(u.display_name)}<small>@${esc(u.username)}</small></td><td>${esc(u.email||'—')}</td><td>${u.role==='admin'?'<span class="pill">admin</span>':`<select class="btn" data-role="${u.id}" aria-label="Role for ${esc(u.username)}"><option value="user" ${u.role==='user'?'selected':''}>user</option><option value="moderator" ${u.role==='moderator'?'selected':''}>moderator</option><option value="senior_moderator" ${u.role==='senior_moderator'?'selected':''}>senior moderator</option><option value="admin" ${u.role==='admin'?'selected':''}>admin</option></select>`}</td><td>${u.posts}</td><td>${u.banned?'Banned':u.suspended?'Suspended':u.upload_restricted?'Uploads restricted':'Active'}</td><td>${u.role==='admin'?'<span class="muted">Protected</span>':`<button class="btn" data-user="${u.id}" data-action="${u.suspended?'restore':'suspend'}">${u.suspended?'Restore':'Suspend'}</button><button class="btn" data-user="${u.id}" data-action="${u.banned?'unban':'ban'}">${u.banned?'Lift ban':'Ban'}</button><button class="btn" data-user="${u.id}" data-action="${u.upload_restricted?'allow':'restrict'}">${u.upload_restricted?'Allow uploads':'Restrict uploads'}</button>`}</td></tr>`).join('')}</tbody></table></div>`}
if(view==='posts'){const {items}=await api('/admin/posts');root.innerHTML=`<h1>Posts and albums</h1><p class="muted">Remove or restore creator content. Changes apply to its post and album together.</p><div class="box"><table><thead><tr><th>Post</th><th>Creator</th><th>Media</th><th>Comments</th><th>Visibility</th><th>Status</th><th>Action</th></tr></thead><tbody>${items.map(p=>`<tr><td>${esc(p.title)}<small>#${p.id}</small></td><td>@${esc(p.username)}</td><td>${p.media_count||0} file(s)</td><td>${p.comments_enabled?`<button class="btn" data-view-comments="${p.id}">View comments (${p.comment_count})</button>`:'Disabled'}</td><td>${esc(p.visibility||'—')}</td><td>${esc(p.album_status||p.status)}</td><td><button class="btn" data-post="${p.id}" data-action="${p.status==='removed'?'restore':'remove'}">${p.status==='removed'?'Restore':'Remove'}</button></td></tr>`).join('')}</tbody></table></div>`}

if(view.startsWith('post-comments:')){const id=view.split(':')[1],{post,items}=await api('/admin/posts/'+id+'/comments');root.innerHTML='<button class="btn" data-view="posts">← Back to posts</button><h1 style="margin-top:18px">Comments on '+esc(post.title)+'</h1><p class="muted">'+items.length+' comments · comments are enabled for this post</p><div class="box"><table><thead><tr><th>Comment</th><th>Author</th><th>Created</th><th>Action</th></tr></thead><tbody>'+items.map(c=>'<tr><td>'+esc(c.body)+'</td><td>'+esc(c.author)+'<small>@'+esc(c.username)+'</small></td><td>'+esc(new Date(c.created_at).toLocaleString())+'</td><td><button class="btn danger" data-comment="'+c.id+'" data-action="delete-comment">Remove</button></td></tr>').join('')+'</tbody></table>'+(items.length?'':'<p class="muted">No comments on this post yet.</p>')+'</div>'}
if(view==='reports'){const {items}=await api('/admin/reports');root.innerHTML=`<h1>Reports</h1><p class="muted">Review incoming reports and record the outcome.</p><div class="box"><table><thead><tr><th>Reported</th><th>Reason and details</th><th>Reporter</th><th>Status</th><th>Update</th></tr></thead><tbody>${items.map(r=>`<tr><td>${r.story_id?`Post: ${esc(r.story_title)} (#${r.story_id})`:r.reported_user?`User: @${esc(r.reported_user)}`:'Unavailable'}</td><td>${esc(r.reason)}<small>${esc(r.details)}</small></td><td>@${esc(r.reporter||'deleted')}</td><td>${esc(r.status)}</td><td><select data-report="${r.id}" class="btn"><option ${r.status==='open'?'selected':''}>open</option><option ${r.status==='reviewing'?'selected':''}>reviewing</option><option ${r.status==='resolved'?'selected':''}>resolved</option><option ${r.status==='dismissed'?'selected':''}>dismissed</option></select></td></tr>`).join('')}</tbody></table></div>`}
if(view==='appeals'){const {items}=await api('/admin/appeals');root.innerHTML=`<h1>Account appeals</h1><p class="muted">Review active account enforcement appeals.</p><div class="box"><table><thead><tr><th>Account</th><th>Enforcement</th><th>Appeal</th><th>Status</th><th>Staff note</th><th>Update</th></tr></thead><tbody>${items.map(a=>`<tr><td>@${esc(a.username)}<small>${esc(a.display_name)}</small></td><td>${esc(a.action||'Account restriction')}<small>${esc(a.enforcement_reason||'')}</small></td><td>${esc(a.reason)}</td><td>${esc(a.status)}</td><td><input data-appeal-reason="${a.id}" maxlength="2000" value="${esc(a.decision_reason||'')}" aria-label="Staff note"></td><td><select data-appeal="${a.id}" class="btn"><option value="open" ${a.status==='open'?'selected':''}>open</option><option value="reviewing" ${a.status==='reviewing'?'selected':''}>reviewing</option><option value="granted" ${a.status==='granted'?'selected':''}>granted</option><option value="denied" ${a.status==='denied'?'selected':''}>denied</option></select></td></tr>`).join('')}</tbody></table>${items.length?'':'<p class="muted">No appeals have been submitted.</p>'}</div>`}
if(view==='cases'){const {items}=await api('/moderation/cases');root.innerHTML=`<h1>Safety cases</h1><p class="muted">Restricted high-priority reports appear here without showing media or sensitive evidence.</p><div class="box"><table><thead><tr><th>Case</th><th>Category</th><th>Priority</th><th>Access</th><th>Created</th><th>Action</th></tr></thead><tbody>${items.map(c=>`<tr><td>#${c.id} · report #${c.report_id||'—'}</td><td>${esc(c.category)}</td><td><span class="pill ${c.priority==='critical'?'red':''}">${esc(c.priority)}</span></td><td>${c.restricted?'Restricted':'Standard'}</td><td>${esc(new Date(c.created_at).toLocaleString())}</td><td><select data-case="${c.id}" class="btn"><option value="reviewing">Reviewing</option><option value="quarantined">Quarantine content</option><option value="resolved">Resolve</option><option value="dismissed">Dismiss</option></select></td></tr>`).join('')}</tbody></table>${items.length?'':'<p class="muted">No open safety cases.</p>'}</div>`}
if(view==='settings'){const {settings}=await api('/admin/overview');root.innerHTML=`<h1>Site controls</h1><p class="muted">These switches are enforced by the backend.</p><div class="box"><div class="settings"><span><strong>Account registration</strong><small>Pause new signups. Existing members can still sign in.</small></span><button class="btn" data-setting="signupsEnabled" data-value="${!settings.signupsEnabled}">${settings.signupsEnabled?'Pause signups':'Enable signups'}</button></div><div class="settings"><span><strong>Creator uploads</strong><small>Pause all uploads. Existing public posts remain visible.</small></span><button class="btn" data-setting="uploadsEnabled" data-value="${!settings.uploadsEnabled}">${settings.uploadsEnabled?'Pause uploads':'Enable uploads'}</button></div></div>`}
if(view==='audit'){const {items}=await api('/admin/audit');root.innerHTML=`<h1>Admin audit log</h1><p class="muted">Recent administrator actions.</p><div class="box"><table><thead><tr><th>Time</th><th>Admin</th><th>Action</th><th>Target</th></tr></thead><tbody>${items.map(a=>`<tr><td>${esc(new Date(a.created_at).toLocaleString())}</td><td>@${esc(a.admin||'removed admin')}</td><td>${esc(a.action)}</td><td>${esc(a.target_type)} #${esc(a.target_id)}</td></tr>`).join('')}</tbody></table></div>`}
applySearch();msg('');}catch(e){root.innerHTML=`<div class="box">${esc(e.message)}</div>`;msg(e.message,true)}}
$('#adminSearch').addEventListener('input',applySearch);$('#loginForm').onsubmit=async e=>{e.preventDefault();const form=new FormData(e.currentTarget);$('#loginFeedback').textContent='';try{await api('/auth/login',{method:'POST',body:JSON.stringify({email:form.get('email'),password:form.get('password')})});await start()}catch(err){$('#loginFeedback').textContent=err.message}};
$('#logout').onclick=async()=>{try{await api('/auth/logout',{method:'POST',body:'{}'})}finally{loginVisible('');$('#logout').classList.add('hidden');$('#who').textContent=''}};
document.addEventListener('click',async e=>{const nav=e.target.closest('[data-view]');if(nav){show(nav.dataset.view);return}const viewButton=e.target.closest('[data-view-comments]');if(viewButton){show('post-comments:'+viewButton.dataset.viewComments);return}const b=e.target.closest('[data-action][data-user],[data-action][data-post],[data-action][data-comment],[data-setting]');if(!b)return;try{if(b.dataset.user){const field=['suspend','restore'].includes(b.dataset.action)?'suspended':['ban','unban'].includes(b.dataset.action)?'banned':'uploadRestricted';const value=['suspend','restrict','ban'].includes(b.dataset.action);await api(`/admin/users/${b.dataset.user}`,{method:'PATCH',body:JSON.stringify({[field]:value})})}else if(b.dataset.post)await api(`/admin/posts/${b.dataset.post}`,{method:'PATCH',body:JSON.stringify({status:b.dataset.action==='remove'?'removed':'published'})});else if(b.dataset.comment)await api(`/admin/comments/${b.dataset.comment}`,{method:'DELETE'});else if(b.dataset.setting)await api('/admin/settings',{method:'PATCH',body:JSON.stringify({[b.dataset.setting]:b.dataset.value==='true'})});msg('Saved.');await show(section)}catch(err){msg(err.message,true)}});
document.addEventListener('change',async e=>{try{if(e.target.matches('[data-report]')){await api(`/admin/reports/${e.target.dataset.report}`,{method:'PATCH',body:JSON.stringify({status:e.target.value})});msg('Report updated.')}if(e.target.matches('[data-case]')){await api(`/moderation/cases/${e.target.dataset.case}`,{method:'PATCH',body:JSON.stringify({status:e.target.value})});msg('Safety case updated.')}if(e.target.matches('[data-appeal]')){const reason=document.querySelector(`[data-appeal-reason="${e.target.dataset.appeal}"]`)?.value||'';await api(`/admin/appeals/${e.target.dataset.appeal}`,{method:'PATCH',body:JSON.stringify({status:e.target.value,reason})});msg('Appeal updated.')}if(e.target.matches('[data-role]')){await api(`/admin/users/${e.target.dataset.role}`,{method:'PATCH',body:JSON.stringify({role:e.target.value})});msg('Role updated.');await show(section)}}catch(err){msg(err.message,true)}});start();
</script></body></html>
